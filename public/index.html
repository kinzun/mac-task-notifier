<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Mac 任务通知</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f5f7; --surface:#fff; --field:#f7f7f9; --border:#dedee3; --text:#1d1d1f; --secondary:#6e6e73; --muted:#77777d; --footer:#fafafb; --blue:#007aff; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif; color:var(--text); background:var(--bg); font-synthesis:none; }
    * { box-sizing:border-box; }
    body { margin:0; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:default; opacity:.45; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
    [hidden] { display:none!important; }
    main { max-width:664px; margin:0 auto; padding:30px 28px 24px; }
    .app-bar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:16px; font-weight:600; letter-spacing:-.3px; }
    .app-icon { display:grid; place-items:center; width:38px; height:38px; border-radius:10px; color:#fff; background:linear-gradient(155deg,#50a8ff,#006bef); box-shadow:inset 0 0 0 1px #ffffff25,0 2px 5px #007aff20; }
    .connection { display:inline-flex; align-items:center; gap:7px; font-size:11px; color:var(--secondary); white-space:nowrap; }
    .connection::before { content:""; width:6px; height:6px; background:#aaaab0; border-radius:50%; }
    .connection[data-state="ready"]::before { background:#34c759; }
    .connection[data-state="error"]::before { background:#ff9500; }
    h1 { margin:0 0 8px; font-size:25px; font-weight:650; line-height:1.3; letter-spacing:-.7px; }
    .intro { margin:0 0 24px; color:var(--secondary); font-size:13px; line-height:1.75; }
    .section-label { margin:0 0 8px 14px; color:var(--secondary); font-size:11px; font-weight:500; }
    .settings { overflow:hidden; border:1px solid var(--border); border-radius:12px; background:var(--surface); box-shadow:0 1px 3px #00000003; }
    .setting { padding:16px 18px; }
    .setting+.setting { border-top:1px solid var(--border); }
    label { display:block; margin-bottom:8px; font-size:12px; font-weight:600; }
    .field-row { display:flex; align-items:center; gap:10px; min-width:0; }
    .field { flex:1; min-width:0; width:100%; height:32px; padding:6px 9px; border:1px solid var(--border); border-radius:6px; background:var(--field); color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; text-overflow:ellipsis; }
    .button { display:inline-flex; justify-content:center; align-items:center; gap:6px; min-height:32px; padding:6px 11px; border:1px solid var(--border); border-radius:6px; color:var(--text); background:var(--surface); box-shadow:0 1px 2px #00000005; font-size:12px; line-height:1.3; white-space:nowrap; }
    .button:hover:not(:disabled) { filter:brightness(.97); }
    .button.primary { border-color:var(--blue); color:#fff; background:var(--blue); box-shadow:0 1px 2px #007aff15; }
    .hint { margin:8px 0 0; color:var(--muted); font-size:11px; line-height:1.65; }
    .actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--border); background:var(--footer); }
    .message { margin:12px 2px 0; min-height:18px; font-size:12px; line-height:1.7; color:var(--secondary); overflow-wrap:anywhere; }
    .message[data-kind="error"] { color:#ce552b; }
    .message[data-kind="success"] { color:#268043; }
    .retry { margin-top:8px; }
    .manual-copy { margin-top:14px; padding:16px; border:1px solid var(--border); border-radius:10px; background:var(--surface); }
    .manual-copy textarea { display:block; width:100%; min-height:112px; margin-top:10px; padding:10px; border:1px solid var(--border); border-radius:6px; resize:vertical; background:var(--field); color:var(--text); font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .guide { margin-top:22px; padding:0 14px; }
    h2 { margin:0 0 7px; font-size:12px; font-weight:600; }
    .guide p { margin:0; color:var(--secondary); font-size:12px; line-height:1.8; }
    .footnote { margin:24px 0 0; padding-top:16px; border-top:1px solid var(--border); color:var(--muted); font-size:10px; line-height:1.8; }
    @media(prefers-color-scheme:dark) { :root { --bg:#1c1c1e; --surface:#2c2c2e; --field:#252527; --border:#454548; --text:#f5f5f7; --secondary:#b4b4ba; --muted:#a1a1a8; --footer:#29292b; --blue:#0a84ff; } .message[data-kind="success"]{color:#63d283} .message[data-kind="error"]{color:#ff9a7c} }
    @media(max-width:480px) { main{padding:24px 18px} .app-bar{margin-bottom:24px} .brand{font-size:14px} .setting{padding:15px} .actions{flex-wrap:wrap;padding:14px} .actions .button{flex:1} .field-row{gap:8px} .guide{padding:0 4px} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <header class="app-bar">
      <div class="brand">
        <span class="app-icon" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><path d="M18 9a6 6 0 0 0-12 0c0 7-2 7-2 8h16c0-1-2-1-2-8Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 20a2.2 2.2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        <span>Mac 任务通知</span>
      </div>
      <span id="connection" class="connection" role="status" data-state="loading">正在连接</span>
    </header>

    <h1>通知接收</h1>
    <p class="intro">任务完成后，在菜单栏提醒你。接收本机和同一局域网的消息。</p>

    <p class="section-label">接收设置</p>
    <section class="settings" aria-label="通知接收设置">
      <div class="setting">
        <label for="endpoint">统一接收地址</label>
        <div class="field-row">
          <input id="endpoint" class="field" readonly value="正在读取…" spellcheck="false" autocomplete="off">
          <button id="copy-endpoint" class="button" type="button" disabled>复制地址</button>
        </div>
        <p class="hint">其他设备须与这台 Mac 位于同一可信局域网。</p>
      </div>
      <div class="setting">
        <label for="token">访问密钥</label>
        <div class="field-row">
          <input id="token" class="field" type="password" readonly value="" aria-label="访问密钥，默认隐藏" spellcheck="false" autocomplete="off">
          <button id="toggle-token" class="button" type="button" aria-pressed="false" disabled>显示密钥</button>
        </div>
        <p class="hint">发送配置已包含密钥，仅分享给你信任的 Hook。</p>
      </div>
      <div class="actions">
        <button id="connect-hook" class="button" type="button" disabled>连接本机 Hook</button>
        <button id="copy-config" class="button" type="button" disabled>复制发送配置</button>
        <button id="test" class="button primary" type="button" disabled><svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m4 10 12-6-4 12-2-5-6-1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span id="test-label">发送测试通知</span></button>
      </div>
    </section>

    <p id="status-message" class="message" role="status" aria-live="polite"></p>
    <button id="retry" class="button retry" type="button" hidden>重新连接</button>
    <section id="manual-copy" class="manual-copy" hidden aria-label="手动复制">
      <label for="copy-text">自动复制不可用，文本已选中，请按 ⌘C 复制。</label>
      <textarea id="copy-text" readonly spellcheck="false" autocomplete="off"></textarea>
    </section>

    <section class="guide" aria-labelledby="guide-title">
      <h2 id="guide-title">连接 Codex</h2>
      <p>安装插件，连接本机 Hook，然后在 Codex 中审阅并信任。其他设备可使用复制的发送配置。</p>
    </section>
    <p class="footnote">关闭设置窗口后仍可接收。铃铛菜单可查看最近消息；系统横幅受通知权限与专注模式影响。HTTP 仅用于可信局域网。</p>
  </main>
  <script>
    const get = id => document.getElementById(id);
    let config;
    const controls = ['copy-endpoint', 'copy-config', 'toggle-token', 'test', 'connect-hook'];
    function showStatus(message, kind = '') {
      get('status-message').textContent = message;
      get('status-message').dataset.kind = kind;
    }
    async function loadConfig() {
      config = undefined;
      controls.forEach(id => { get(id).disabled = true; });
      get('retry').hidden = true;
      get('manual-copy').hidden = true;
      get('token').type = 'password';
      get('toggle-token').textContent = '显示密钥';
      get('toggle-token').setAttribute('aria-pressed', 'false');
      get('connection').textContent = '正在连接';
      get('connection').dataset.state = 'loading';
      showStatus('');
      try {
        const response = await fetch('/api/config', { cache: 'no-store' });
        if (!response.ok) throw new Error('config');
        const data = await response.json();
        if (typeof data.endpoint !== 'string' || typeof data.token !== 'string' || !data.token || !/^https?:$/.test(new URL(data.endpoint).protocol)) throw new Error('config');
        config = data;
        get('endpoint').value = data.endpoint;
        get('token').value = data.token;
        get('connection').textContent = '服务已连接';
        get('connection').dataset.state = 'ready';
        controls.forEach(id => { get(id).disabled = false; });
      } catch {
        get('endpoint').value = '暂时无法读取接收地址';
        get('token').value = '';
        get('connection').textContent = '未连接';
        get('connection').dataset.state = 'error';
        showStatus('连接失败，请确认本机服务正在运行，然后重新连接。', 'error');
        get('retry').hidden = false;
      }
    }
    async function copyText(text, label) {
      get('manual-copy').hidden = true;
      try {
        await navigator.clipboard.writeText(text);
        showStatus(label + '已复制。', 'success');
      } catch {
        get('copy-text').value = text;
        get('manual-copy').hidden = false;
        get('copy-text').focus();
        get('copy-text').select();
        showStatus('请在下方手动复制。');
      }
    }
    get('copy-endpoint').addEventListener('click', () => copyText(config.endpoint, '接收地址'));
    get('connect-hook').addEventListener('click', async () => {
      get('connect-hook').disabled = true;
      try {
        const response = await fetch('/api/connect', { method: 'POST', headers: { Authorization: 'Bearer ' + config.token } });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '保存失败');
        showStatus('本机接收配置已保存。安装插件并在 Codex 中信任 Hook 后生效。', 'success');
      } catch (error) {
        showStatus('连接失败：' + error.message, 'error');
      } finally { get('connect-hook').disabled = false; }
    });
    get('copy-config').addEventListener('click', () => copyText(JSON.stringify({ url: config.endpoint, token: config.token }, null, 2), '发送配置'));
    get('toggle-token').addEventListener('click', () => {
      const visible = get('token').type === 'password';
      get('token').type = visible ? 'text' : 'password';
      get('toggle-token').textContent = visible ? '隐藏密钥' : '显示密钥';
      get('toggle-token').setAttribute('aria-pressed', String(visible));
    });
    get('test').addEventListener('click', async () => {
      get('test').disabled = true;
      get('test-label').textContent = '正在发送…';
      showStatus('');
      try {
        const response = await fetch('/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + config.token },
          body: JSON.stringify({ title: '任务完成', message: '任务已完成，可以回来看看了。' })
        });
        if (!response.ok) {
          const unauthorized = response.status === 401 || response.status === 403;
          get('retry').hidden = !unauthorized;
          showStatus(unauthorized ? '发送失败：密钥校验未通过，请重新连接获取配置。' : '发送失败：系统通知暂不可用，请检查通知权限后重试。', 'error');
          return;
        }
        showStatus('完成提醒已提交，请查看右上角铃铛。', 'success');
      } catch {
        showStatus('发送失败：无法连接本机服务，请确认服务正在运行后重试。', 'error');
      } finally {
        get('test').disabled = false;
        get('test-label').textContent = '发送测试通知';
      }
    });
    get('retry').addEventListener('click', loadConfig);
    loadConfig();
  </script>
</body>
</html>
